{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold">Settings</h2>
    <div class="card p-4 mt-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <p class="mb-0 fw-bold">Dark Mode</p>
                <small class="text-muted">Change the site theme.</small>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkModeToggle" style="transform: scale(1.5);">
            </div>
        </div>
    </div>
</div>

<script>
    const toggle = document.getElementById('darkModeToggle');
    const body = document.getElementById('mainBody');
    if (localStorage.getItem('theme') === 'dark') { toggle.checked = true; }
    toggle.addEventListener('change', () => {
        if (toggle.checked) {
            body.classList.add('dark-mode');
            localStorage.setItem('theme', 'dark');
        } else {
            body.classList.remove('dark-mode');
            localStorage.setItem('theme', 'light');
        }
    });
</script>
{% endblock %}
