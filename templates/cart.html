{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
    {% if items %}
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="text-end">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td>{{ item.name }}</td>
                            <td class="text-end">{{ item.price }} TMT</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <h4 class="fw-bold">Total:</h4>
                    <h4 class="text-primary fw-bold">{{ total }} TMT</h4>
                </div>
                <button class="btn btn-success w-100 py-3 mt-3 fw-bold">Proceed to Checkout</button>
            </div>
        </div>
    {% else %}
        <div class="text-center py-5">
            <span style="font-size: 50px;">🛒</span>
            <p class="mt-3 text-muted">Your cart is empty.</p>
            <a href="/" class="btn btn-primary px-4">Start Shopping</a>
        </div>
    {% endif %}
</div>
{% endblock %}
