{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4">{{ lang.cart }}</h2>
    {% if items %}
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table">
                    {% for item in items %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td class="text-end">{{ item.price }} TMT</td>
                    </tr>
                    {% endfor %}
                </table>
                <div class="d-flex justify-content-between mt-4">
                    <h4 class="fw-bold">{{ lang.total }}:</h4>
                    <h4 class="text-primary fw-bold">{{ total }} TMT</h4>
                </div>
                <button onclick="alert('{{ lang.delivery }}')" class="btn btn-success w-100 py-3 mt-3 fw-bold">{{ lang.checkout }}</button>
            </div>
        </div>
    {% else %}
        <div class="text-center py-5">
            <p>{{ lang.empty }}</p>
            <a href="/" class="btn btn-primary">{{ lang.home }}</a>
        </div>
    {% endif %}
</div>
{% endblock %}
