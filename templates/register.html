{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 border-primary" style="border-top: 4px solid #007bff;">
            <div class="card-body">
                <h3 class="text-center mb-2">Create Account</h3>
                <p class="text-center text-muted small mb-4">Join our Turkmen Heritage community</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Get Started</button>
                </form>
                <p class="text-center mt-4 mb-0 small">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
