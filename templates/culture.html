{% extends "base.html" %}
{% block content %}
<div style="background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color: var(--main-red); border-bottom: 2px solid var(--gold); padding-bottom: 10px;">Türkmen Medeniýeti</h2>
    
    <div style="margin: 20px 0;">
        <img src="https://images.unsplash.com/photo-1523450031158-7118ae76c15b?w=800" 
             style="width: 100%; border-radius: 10px; border: 1px solid var(--gold);">
    </div>

    <div style="line-height: 1.8; font-size: 16px; text-align: justify;">
        {{ info }}
    </div>

    <div style="margin-top: 30px; padding: 15px; background: rgba(212, 175, 55, 0.1); border-left: 4px solid var(--gold);">
        <p style="margin: 0; font-style: italic; font-size: 14px;">
            "Haly - türkmeniň kalby, ahalteke bedewi - türkmeniň ganaty."
        </p>
    </div>
    
    <p style="font-size: 12px; color: gray; margin-top: 20px;">Source: Wikipedia API</p>
</div>
{% endblock %}
