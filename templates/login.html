{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <div class="card-body">
                <h3 class="text-center mb-4">Welcome Back</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small uppercase">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small uppercase">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>
                <p class="text-center mt-4 mb-0 small">
                    New here? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
