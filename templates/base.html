<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkmen Heritage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-bottom: 80px; background-color: #f8f9fa; transition: 0.3s; }
        body.dark-mode { background-color: #121212; color: #ffffff; }
        .dark-mode .card, .dark-mode .bottom-nav, .dark-mode .navbar { background-color: #1e1e1e; border-color: #333; color: white; }
        .dark-mode .nav-link, .dark-mode .navbar-brand { color: white !important; }
        .navbar { border-bottom: 1px solid #eee; background-color: white; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .bottom-nav a { text-decoration: none; color: #555; text-align: center; font-size: 11px; font-weight: 600; }
        .bottom-nav span { display: block; font-size: 20px; }
    </style>
</head>
<body id="mainBody">

<nav class="navbar navbar-expand-lg mb-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🇹🇲 HERITAGE</a>
        <div class="ms-auto">
            {% if not current_user.is_authenticated %}
                <a href="/login" class="btn btn-sm btn-outline-dark me-2">Login</a>
                <a href="/register" class="btn btn-sm btn-primary">Join</a>
            {% else %}
                <span class="small me-2">Hi, {{ current_user.username }}</span>
                <a href="/logout" class="btn btn-sm btn-link text-danger text-decoration-none">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<nav class="bottom-nav">
    <a href="/"><span>🏠</span>Home</a>
    <a href="/culture"><span>🇹🇲</span>Culture</a>
    <a href="/cart"><span>🛒</span>Cart</a>
    <a href="/settings"><span>⚙️</span>Settings</a>
</nav>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.getElementById('mainBody').classList.add('dark-mode');
    }
</script>
</body>
</html>
