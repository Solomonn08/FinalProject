<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkmen Heritage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
     /* Делаем все картинки одного размера и красивую сетку */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
    padding: 20px;
}

.product-card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.product-card img {
    width: 100%;
    height: 280px;      /* Квадратная форма для более сбалансированного вида */
    object-fit: cover;  /* Магия: фото заполнит блок без искажений, центрировано и обрезано */
    border-radius: 8px;
    margin-bottom: 10px;
}

/* Hero Blocks for Main Page */
.hero-section {
    position: relative;
    height: 550px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.hero-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.hero-title {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.hero-subtitle {
    font-size: 20px;
    font-weight: 300;
    margin-bottom: 30px;
    opacity: 0.9;
}

.hero-btn {
    background: transparent;
    color: white;
    border: 2px solid white;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.hero-btn:hover {
    background: white;
    color: #333;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Category-specific styling */
.hero-tahya { background-image: url('/static/images/tahya/t3.avif'); }
.hero-carpets { background-image: url('/static/images/carpets/image-1.jpg'); }
.hero-bags { background-image: url('/static/images/bags/b2.webp'); }
.hero-accessories { background-image: url('/static/images/accessories/bracelets/bracelet1.avif'); }
.hero-women { background-image: url('/static/images/women dress/d1.avif'); }
.hero-men { background-image: url('/static/images/man dress/m1.jpg'); }
.hero-headwear { background-image: url('/static/images/on head/h1.webp'); }
.hero-traditional { background-image: url('/static/images/telpek/telpek1.webp'); }

.hero-section {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Search Bar Styling */
.search-form {
    flex-grow: 1;
    max-width: 600px;
    margin: 0 20px;
}

.search-input {
    width: 100%;
    padding: 10px 20px;
    border-radius: 50px;
    border: 1px solid #e9ecef;
    background-color: #f8f9fa;
    font-size: 14px;
    transition: all 0.3s ease;
    outline: none;
}

.search-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    background-color: white;
}

.search-input::placeholder {
    color: #6c757d;
}

/* Modern Header Styling */
.modern-header {
    background: white;
    border-bottom: 1px solid #e9ecef;
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Icon Group Styling */
.icon-group {
    display: flex;
    align-items: center;
    gap: 5px; /* Reduced gap between icons */
}

.brand-link {
    font-size: 24px;
    font-weight: 700;
    text-decoration: none;
    color: #333;
    letter-spacing: 1px;
}

/* Language Selector */
.language-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #6c757d;
}

.lang-option {
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s ease;
}

.lang-option:hover {
    color: #333;
    background-color: #f8f9fa;
}

.lang-option.active {
    color: #333;
    background-color: #e9ecef;
}

.lang-divider {
    color: #dee2e6;
}

/* Header Icons */
.header-icon {
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: #333; /* Force black color for all icons */
    filter: grayscale(100%); /* Remove color from emojis */
}

.header-icon:hover {
    background-color: #f8f9fa;
    transform: scale(1.1);
}

/* Search Overlay */
.search-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.search-overlay.active {
    display: flex;
    opacity: 1;
}

.search-container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    width: 90%;
    max-width: 600px;
    position: relative;
    animation: slideIn 0.3s ease-in-out;
}

.search-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    font-size: 30px;
    cursor: pointer;
    color: #6c757d;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.search-close:hover {
    background-color: #f8f9fa;
    color: #333;
}

/* Offcanvas Menu */
.offcanvas-menu {
    position: fixed;
    top: 0;
    right: 0;
    width: 350px;
    height: 100%;
    background: white;
    box-shadow: -5px 0 25px rgba(0,0,0,0.1);
    transform: translateX(100%);
    transition: transform 0.3s ease-in-out;
    z-index: 1500;
    display: flex;
    flex-direction: column;
}

.offcanvas-menu.active {
    transform: translateX(0);
}

.offcanvas-content {
    flex: 1;
    padding: 40px 30px;
    overflow-y: auto;
}

.offcanvas-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 30px;
    cursor: pointer;
    color: #6c757d;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.offcanvas-close:hover {
    background-color: #f8f9fa;
    color: #333;
}

/* Menu Links */
.menu-links {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
}

.menu-link {
    font-size: 18px;
    font-weight: 500;
    color: #333;
    text-decoration: none;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
    transition: all 0.2s ease;
}

.menu-link:hover {
    color: #007bff;
    padding-left: 10px;
}

/* Account Panel Styling */
.account-content {
    margin-top: 20px;
}

.account-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 30px;
    color: #333;
}

/* Toggle Buttons */
.toggle-buttons {
    display: flex;
    background: #f8f9fa;
    padding: 4px;
    border-radius: 8px;
    margin-bottom: 30px;
}

.toggle-btn {
    flex: 1;
    padding: 12px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #6c757d;
}

.toggle-btn.active {
    background: #333;
    color: white;
}

.toggle-btn:not(.active):hover {
    background: #e9ecef;
}

/* Account Forms */
.account-form {
    margin-bottom: 30px;
}

.form-input {
    width: 100%;
    padding: 15px;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 15px;
    transition: all 0.2s ease;
    outline: none;
}

.form-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
}

.forgot-link {
    display: block;
    text-align: right;
    color: #6c757d;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
    transition: color 0.2s ease;
}

.forgot-link:hover {
    color: #007bff;
}

.continue-btn {
    width: 100%;
    padding: 15px;
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    transition: all 0.2s ease;
}

.continue-btn:hover {
    background-color: #e9ecef;
    transform: translateY(-1px);
}

.privacy-text {
    font-size: 12px;
    color: #6c757d;
    line-height: 1.4;
    text-align: center;
}

.hidden {
    display: none !important;
}

/* Animations */
@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .header-content {
        padding: 15px;
    }
    
    .brand-link {
        font-size: 20px;
    }
    
    .language-selector {
        display: none; /* Hide on mobile for cleaner look */
    }
    
    .offcanvas-menu {
        width: 100%;
    }
    
    .search-container {
        width: 95%;
        padding: 20px;
    }
    
    .account-title {
        font-size: 24px;
    }
    
    .hero-title {
        font-size: 32px;
    }
    
    .hero-subtitle {
        font-size: 16px;
    }
    
    .hero-btn {
        padding: 12px 30px;
        font-size: 16px;
    }
    
    .hero-section {
        height: 400px;
    }
}

@media (max-width: 480px) {
    .hero-title {
        font-size: 24px;
    }
    
    .hero-section {
        height: 350px;
    }
}
    </style>
</head>
<body id="mainBody">

<!-- Modern Header -->
<header class="modern-header">
    <div class="container-fluid">
        <div class="header-content">
            <!-- Brand -->
            <div class="brand">
                <a href="/" class="brand-link">🇹🇲 HERITAGE</a>
            </div>
            
            <!-- Language Selector -->
            <div class="language-selector">
                <a href="?lang=en" class="lang-option {{ 'active' if request.args.get('lang') == 'en' or (request.args.get('lang') is none and session.get('language') == 'en') or (request.args.get('lang') is none and session.get('language') is none and request.accept_languages.best_match(['en', 'ru', 'tk'], default='en') == 'en') else '' }}">EN</a>
                <span class="lang-divider">|</span>
                <a href="?lang=ru" class="lang-option {{ 'active' if request.args.get('lang') == 'ru' or (request.args.get('lang') is none and session.get('language') == 'ru') or (request.args.get('lang') is none and session.get('language') is none and request.accept_languages.best_match(['en', 'ru', 'tk'], default='en') == 'ru') else '' }}">RU</a>
                <span class="lang-divider">|</span>
                <a href="?lang=tk" class="lang-option {{ 'active' if request.args.get('lang') == 'tk' or (request.args.get('lang') is none and session.get('language') == 'tk') or (request.args.get('lang') is none and session.get('language') is none and request.accept_languages.best_match(['en', 'ru', 'tk'], default='en') == 'tk') else '' }}">TK</a>
            </div>
            
            <!-- Icon Group -->
            <div class="icon-group">
                <!-- Search Icon -->
                <div class="header-icon" id="searchIcon" title="Search">
                    🔍
                </div>
                
                <!-- Favorites Icon -->
                <div class="header-icon" id="favoritesIcon" title="Favorites">
                    ⭐
                </div>
                
                <!-- Profile Icon -->
                <div class="header-icon" id="profileIcon" title="Account">
                    👤
                </div>
                
                <!-- Burger Menu Icon -->
                <div class="header-icon" id="burgerIcon" title="Menu">
                    ☰
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Search Overlay -->
<div class="search-overlay" id="searchOverlay">
    <div class="search-container">
        <button class="search-close" id="searchClose">×</button>
        <form class="search-form" action="/search" method="GET">
            <input type="text" name="q" class="search-input" placeholder="{{ _('Search products...') }}" value="{{ request.args.get('q', '') }}" autofocus>
        </form>
    </div>
</div>

<!-- Main Menu Offcanvas -->
<div class="offcanvas-menu" id="mainMenu">
    <div class="offcanvas-content">
        <button class="offcanvas-close" id="mainMenuClose">×</button>
        <div class="menu-links">
            <a href="/" class="menu-link">{{ _('Home') }}</a>
            <a href="/culture" class="menu-link">{{ _('TM Culture') }}</a>
            <a href="/cart" class="menu-link">{{ _('Cart') }}</a>
            <a href="/settings" class="menu-link">{{ _('Settings') }}</a>
        </div>
    </div>
</div>

<!-- Account Offcanvas -->
<div class="offcanvas-menu" id="accountMenu">
    <div class="offcanvas-content">
        <button class="offcanvas-close" id="accountMenuClose">×</button>
        <div class="account-content">
            <h2 class="account-title">{{ _('Your Account') }}</h2>
            
            <!-- Toggle Buttons -->
            <div class="toggle-buttons">
                <button class="toggle-btn active" id="signInBtn">{{ _('Sign In') }}</button>
                <button class="toggle-btn" id="createBtn">{{ _('Create') }}</button>
            </div>
            
            <!-- Sign In Form -->
            <form class="account-form" id="signInForm">
                <input type="email" placeholder="{{ _('Enter your email') }}" class="form-input" required>
                <input type="password" placeholder="{{ _('Password') }}" class="form-input" required>
                <a href="#" class="forgot-link">forgot your password?</a>
                <button type="submit" class="continue-btn">{{ _('Continue') }}</button>
            </form>
            
            <!-- Create Account Form (Hidden by default) -->
            <form class="account-form hidden" id="createForm">
                <input type="email" placeholder="{{ _('Enter your email') }}" class="form-input" required>
                <input type="password" placeholder="{{ _('Create password') }}" class="form-input" required>
                <input type="password" placeholder="{{ _('Confirm password') }}" class="form-input" required>
                <button type="submit" class="continue-btn">{{ _('Create Account') }}</button>
            </form>
            
            <p class="privacy-text">By continuing, you agree to our Privacy Policy and Terms of Service.</p>
        </div>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
    // Theme functionality
    if (localStorage.getItem('theme') === 'dark') {
        document.getElementById('mainBody').classList.add('dark-mode');
    }

    // Language selector functionality
    document.querySelectorAll('.lang-option').forEach(option => {
        option.addEventListener('click', function() {
            document.querySelectorAll('.lang-option').forEach(opt => opt.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Search overlay functionality
    const searchIcon = document.getElementById('searchIcon');
    const searchOverlay = document.getElementById('searchOverlay');
    const searchClose = document.getElementById('searchClose');

    searchIcon.addEventListener('click', function() {
        searchOverlay.classList.add('active');
        // Focus on search input when overlay opens
        const searchInput = searchOverlay.querySelector('.search-input');
        if (searchInput) {
            setTimeout(() => searchInput.focus(), 300);
        }
    });

    searchClose.addEventListener('click', function() {
        searchOverlay.classList.remove('active');
    });

    // Close search overlay when clicking outside
    searchOverlay.addEventListener('click', function(e) {
        if (e.target === this) {
            searchOverlay.classList.remove('active');
        }
    });

    // Main menu offcanvas functionality
    const burgerIcon = document.getElementById('burgerIcon');
    const mainMenu = document.getElementById('mainMenu');
    const mainMenuClose = document.getElementById('mainMenuClose');

    burgerIcon.addEventListener('click', function() {
        mainMenu.classList.add('active');
    });

    mainMenuClose.addEventListener('click', function() {
        mainMenu.classList.remove('active');
    });

    // Close main menu when clicking outside
    mainMenu.addEventListener('click', function(e) {
        if (e.target === this) {
            mainMenu.classList.remove('active');
        }
    });

    // Account offcanvas functionality
    const profileIcon = document.getElementById('profileIcon');
    const accountMenu = document.getElementById('accountMenu');
    const accountMenuClose = document.getElementById('accountMenuClose');

    profileIcon.addEventListener('click', function() {
        accountMenu.classList.add('active');
    });

    accountMenuClose.addEventListener('click', function() {
        accountMenu.classList.remove('active');
    });

    // Close account menu when clicking outside
    accountMenu.addEventListener('click', function(e) {
        if (e.target === this) {
            accountMenu.classList.remove('active');
        }
    });

    // Toggle buttons functionality
    const signInBtn = document.getElementById('signInBtn');
    const createBtn = document.getElementById('createBtn');
    const signInForm = document.getElementById('signInForm');
    const createForm = document.getElementById('createForm');

    signInBtn.addEventListener('click', function() {
        signInBtn.classList.add('active');
        createBtn.classList.remove('active');
        signInForm.classList.remove('hidden');
        createForm.classList.add('hidden');
    });

    createBtn.addEventListener('click', function() {
        createBtn.classList.add('active');
        signInBtn.classList.remove('active');
        createForm.classList.remove('hidden');
        signInForm.classList.add('hidden');
    });

    // Favorites icon functionality (placeholder)
    const favoritesIcon = document.getElementById('favoritesIcon');
    favoritesIcon.addEventListener('click', function() {
        // Placeholder for favorites functionality
        alert('Favorites feature coming soon!');
    });

    // Form submission handling
    signInForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const email = this.querySelector('input[type="email"]').value;
        const password = this.querySelector('input[type="password"]').value;
        
        // Placeholder for sign-in logic
        alert(`Signing in with email: ${email}`);
        accountMenu.classList.remove('active');
    });

    createForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const email = this.querySelector('input[type="email"]').value;
        const password = this.querySelector('input[type="password"]').value;
        
        // Placeholder for create account logic
        alert(`Creating account with email: ${email}`);
        accountMenu.classList.remove('active');
    });

    // Close menus when pressing Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchOverlay.classList.remove('active');
            mainMenu.classList.remove('active');
            accountMenu.classList.remove('active');
        }
    });
</script>
</body>
</html>
