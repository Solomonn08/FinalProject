{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mb-4">
            <img src="{{ product.img }}" class="img-fluid rounded shadow-sm">
        </div>
        <div class="col-md-6">
            <h1 class="fw-bold">{{ get_translated_product_name(product.name, product.category) }}</h1>
            <h3 class="text-success mb-3">{{ product.price }} TMT</h3>
            <p>{{ get_translated_product_description(product.name, product.category) }}</p>
            <hr>
            <form action="{{ url_for('add_to_cart', pid=product.id) }}" method="POST">
                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold">Add to Cart 🛒</button>
            </form>
            <a href="/" class="btn btn-outline-secondary w-100 mt-2">Back to Collection</a>
        </div>
    </div>
</div>
{% endblock %}
