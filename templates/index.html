{% extends "base.html" %}
{% block content %}
<div style="display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; scrollbar-width: none;">
    <a href="/" style="padding: 8px 15px; background: var(--card); border: 1px solid var(--gold); border-radius: 20px; text-decoration: none; color: var(--text); white-space: nowrap;">Ählisi</a>
    {% for cat in categories %}
    <a href="/?category={{ cat }}" style="padding: 8px 15px; background: var(--card); border: 1px solid var(--gold); border-radius: 20px; text-decoration: none; color: var(--text); white-space: nowrap;">{{ cat }}</a>
    {% endfor %}
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
    {% for p in products %}
    <a href="/product/{{ p.id }}" style="text-decoration: none; color: inherit; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <img src="{{ p.img }}" style="width: 100%; height: 140px; object-fit: cover;">
        <div style="padding: 10px;">
            <p style="margin: 0; font-size: 14px; font-weight: bold;">{{ p.name }}</p>
            <b style="color: var(--red);">{{ p.price }} TMT</b>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
